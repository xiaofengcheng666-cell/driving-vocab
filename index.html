    else if(o.op==="miss"){R.push(`<span class="wbad"><span class="x">${esc(o.a[0])}</span></span>`);fix.push(`漏了 ${esc(o.a[0].toLowerCase())}`)}
    else if(o.op==="split"){U.push(`<span class="x">${esc(o.u.join(" "))}</span>`);R.push(`<span class="wbad">${esc(o.a[0])}</span>`);fix.push(`${esc(o.u.join(" "))} 是一个词，中间不空格：${esc(o.a[0].toLowerCase())}`)}
    else if(o.op==="hyph"){U.push(`<span class="x">${esc(o.u.join(" "))}</span>`);R.push(`<span class="wbad">${esc(o.a[0])}</span>`);fix.push(`中间要用连字符：${esc(o.a[0])}`)}
    else if(o.op==="join"){U.push(`<span class="x">${esc(o.u[0])}</span>`);R.push(`<span class="wbad">${esc(o.a.join(" "))}</span>`);fix.push(`${esc(o.u[0])} 要分开写：${esc(o.a.join(" ").toLowerCase())}`)}}
  return `<div class="cmp"><div class="cline"><span class="lab">你写的</span><span class="spellans">${U.join(" ")}</span></div>
    <div class="cline"><span class="lab">正确</span><span class="spellans">${R.join(" ")}</span></div>
    <div class="fix">要改的：${fix.join("；")||"注意大小写以外的符号，比如连字符和撇号"}</div></div>`}

function inGroup(x){return x.n>=GROUPS[g][1]&&x.n<=GROUPS[g][2]}
function pool(){let p=D.filter(inGroup);
  if($("onlyAgain").checked)p=p.filter(x=>mode==="spell"?!S(x.n).spell:mode==="say"?!S(x.n).say:!(S(x.n).say&&S(x.n).spell));return p}
function stats(){const p=D.filter(inGroup);
  const a=p.filter(x=>S(x.n).say).length,b=p.filter(x=>S(x.n).spell).length;
  $("stats").textContent=`本组 ${p.length} 个 · 读音过关 ${a} · 拼写过关 ${b}`}
function pills(x){const s=S(x.n);return `<span class="pills">${s.say?'<span class="pill ok">读音过关</span>':""}${s.spell?'<span class="pill ok">拼写过关</span>':""}</span>`}
function empty(msg){$("view").innerHTML=`<div class="card"><div class="zh">${msg}</div><p class="hint">取消勾选「只练没过关的」，或换一组继续。</p></div>`}

function navHtml(){return `<div class="nav"><button class="btn" id="prev">上一个</button><button class="btn" id="next">下一个</button></div>`}
function bindNav(p,fn){$("prev").onclick=()=>{idx=(idx-1+p.length)%p.length;shown=false;lastRes="";fn()};$("next").onclick=()=>{idx=(idx+1)%p.length;shown=false;lastRes="";fn()}}

/* 听读 */
function renderSay(){
  const p=pool(); if(!p.length){empty("这一组的读音都过关了");stats();return}
  if(idx>=p.length)idx=0; const x=p[idx];
  $("view").innerHTML=`<div class="card">
    <div class="top"><span class="num">#${x.n} · ${idx+1} / ${p.length}</span>${pills(x)}</div>
    <div class="zh">${esc(x.zh)}</div>
    ${shown?`
      ${spellMsg?`<div class="res">${spellMsg}</div>`:""}
      <div class="word">${esc(x.w)}</div><div class="ipa">${esc(x.ipa)}</div>
      <div class="btns"><button class="btn primary" id="aW">${SPK}听单词</button><button class="btn" id="aS">${SPK}单词慢速</button></div>
      <div class="phrase"><div class="en">${esc(x.ph)}</div><div class="pzh">${esc(x.phzh)}</div></div>
      <div class="btns"><button class="btn primary" id="aP">${SPK}听短语</button><button class="btn" id="aPS">${SPK}短语慢速</button></div>
      <div class="box">
        <h3>读给手机听</h3>
        <div class="btns"><button class="btn talk" id="tW" data-l="🎤 读单词">🎤 读单词</button><button class="btn talk" id="tP" data-l="🎤 读短语">🎤 读短语</button></div>
        <p class="hint" id="sayHint">${SR?"点一下按钮开口读，读完停一下会自动结束。":"这个浏览器不支持语音识别：点按钮后用键盘上的 🎤 听写。"}</p>
        <div class="btns"><button class="btn" id="mine"${myUrl&&myFor===x.n?"":" hidden"}>${SPK}听我的录音</button><button class="btn" id="cmpW"${myUrl&&myFor===x.n?"":" hidden"}>${SPK}再听标准音</button></div>
        <input class="txt" id="said" type="text" autocomplete="off" placeholder="识别出的文字会出现在这里"${SR?" hidden":""}>
        <div class="res" id="res" aria-live="polite">${lastRes}</div>
      </div>`
    :`<div class="box">
        <h3>先说一遍，再拼一遍</h3>
        <form id="f0"><input class="txt" id="sp0" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="拼写英文（可跳过）"></form>
        <div class="btns"><button class="btn primary" id="chk0" type="button">检查拼写</button><button class="btn" id="rev" type="button">直接看答案</button></div>
      </div>`}
    ${navHtml()}</div>`;
  bindNav(p,()=>{spellMsg="";renderSay()});
  if(!shown){
    const reveal=()=>{shown=true;renderSay();play("w"+x.n,$("aW"))};
    const chk0=()=>{const v=$("sp0").value; if(!v.trim()){spellMsg="";reveal();return}
      const ok=opts(x.w).find(o=>normSpell(o)===normSpell(v));
      if(ok){S(x.n).spell=true;save();spellMsg=`<span class="verdict ok">拼对了！</span> 已标记拼写过关。`}
      else spellMsg=`<span class="verdict bad">拼写不对。</span> 红色是错的部分：${spellCompare(v,closest(v,x.w))}`;
      reveal()};
    $("rev").onclick=()=>{spellMsg="";reveal()};
    $("chk0").onclick=chk0;
    $("f0").addEventListener("submit",e=>{e.preventDefault();chk0()});
    stats();return}
  $("aW").onclick=e=>play("w"+x.n,e.currentTarget);
  $("aS").onclick=e=>play("w"+x.n+"s",e.currentTarget);
  $("aP").onclick=e=>play("p"+x.n,e.currentTarget);
  $("aPS").onclick=e=>play("p"+x.n+"s",e.currentTarget);
  const inp=$("said"); let timer=null;
  const pick=t=>{tgt=t;lastRes="";$("res").innerHTML="";inp.value="";
    $("sayHint").textContent=`现在点键盘上的 🎤，读：${t==="w"?opts(x.w)[0]:x.ph}`;inp.focus()};
  const showMine=()=>{myFor=x.n;$("mine").hidden=false;$("cmpW").hidden=false};
  const bindTalk=(btn,t)=>{
    const reset=()=>{btn.classList.remove("rec");btn.textContent=btn.dataset.l};
    btn.onclick=()=>{
      if(btn.classList.contains("rec")){btn.textContent="识别中…";$("res").innerHTML='<span class="hint">识别中……</span>';stopTalk();return}
      if(document.querySelector(".talk.rec"))return;
      player.pause();if(playingBtn){playingBtn.classList.remove("playing");playingBtn=null}
      tgt=t;lastRes="";btn.classList.add("rec");btn.textContent="■ 正在听（点我结束）";
      $("res").innerHTML='<span class="hint">正在听……读完停一下就会自动结束</span>';
      startTalk(alts=>{reset();run(alts)},showMine,msg=>{reset();$("res").innerHTML=`<span class="verdict bad">${msg}</span>`})};
    btn.addEventListener("contextmenu",e=>e.preventDefault())};
  if(SR){bindTalk($("tW"),"w");bindTalk($("tP"),"p")}
  else{$("tW").onclick=()=>pick("w");$("tP").onclick=()=>pick("p")}
  $("mine").onclick=e=>{if(myUrl)playUrl(myUrl,e.currentTarget)};
  $("cmpW").onclick=e=>play((tgt==="w"?"w":"p")+x.n,e.currentTarget);
  const run=(alts)=>{alts=(alts||[inp.value]).map(s=>String(s).trim()).filter(Boolean);
    if(!alts.length){$("res").innerHTML=SR?'<span class="hint">没听清，离手机近一点，点按钮再读一次。</span><span class="hint" style="display:block;font-size:.75rem;opacity:.7">诊断：'+esc(talkInfo)+'</span>':"";return}
    const target=tgt==="w"?x.w:x.ph; let r=null,v="";
    for(const a of alts){const q=checkSpeech(a,target);if(!r||q.score>r.score){r=q;v=a}}
    const marks=r.marks.map(([w,ok])=>`<span class="${ok?"ok":"miss"}">${esc(w)}</span>`).join(" ");
    let html=`手机听到：「${esc(v)}」<br>`;
    if(r.score===1){html+=`<span class="verdict ok">读对了。</span> ${marks}`;
      if(tgt==="w"){S(x.n).say=true;save();html+=` 已标记读音过关。`}else html+=` 短语也读得很清楚。`}
    else{html+=`<span class="verdict bad">手机没听出：</span>${marks}<br><span class="hint">红色的词没被识别。先点「慢速」听，注意重音，再读一次。</span>`}
    lastRes=html;$("res").innerHTML=html;stats();
    const pl=document.querySelector(".card .top .pills");if(pl)pl.outerHTML=pills(x)};
  inp.addEventListener("input",()=>{clearTimeout(timer);timer=setTimeout(()=>run(),700)});
  inp.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();clearTimeout(timer);run()}});
  stats();
}

/* 拼写 */
function renderSpell(){
  const p=pool(); if(!p.length){empty("这一组的拼写都过关了");stats();return}
  if(idx>=p.length)idx=0; const x=p[idx];
  $("view").innerHTML=`<div class="card">
    <div class="top"><span class="num">#${x.n} · ${idx+1} / ${p.length}</span>${pills(x)}</div>
    <div class="zh">${esc(x.zh)}</div>
    <div class="btns"><button class="btn primary" id="aW">${SPK}听读音</button><button class="btn" id="aS">${SPK}慢速</button></div>
    <div class="box">
      <h3>拼出英文${opts(x.w).length>1?"（任写其中一个）":""}</h3>
      <form id="f"><input class="txt" id="sp" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="在这里拼写"></form>
      <div class="btns"><button class="btn primary" id="chk" type="button">检查</button><button class="btn" id="show" type="button">看答案</button></div>
      <div class="res" id="res" aria-live="polite"></div>
    </div>
    ${navHtml()}</div>`;
  bindNav(p,renderSpell);
  $("aW").onclick=e=>play("w"+x.n,e.currentTarget);
  $("aS").onclick=e=>play("w"+x.n+"s",e.currentTarget);
  const check=()=>{const v=$("sp").value; if(!v.trim()){$("res").innerHTML='<span class="hint">先输入拼写。</span>';return}
    const ok=opts(x.w).find(o=>normSpell(o)===normSpell(v));
    if(ok){S(x.n).spell=true;save();
      $("res").innerHTML=`<span class="verdict ok">拼对了！</span> 已标记拼写过关。<div class="spellans">${esc(ok)}</div><div class="hint">${esc(x.ipa)} · ${esc(x.ph)}</div>`;
      play("w"+x.n,null)}
    else{const best=opts(x.w)[0];
      $("res").innerHTML=`<span class="verdict bad">还不对。</span> 红色是错的字母：${spellCompare(v,closest(v,x.w))}<span class="hint">清空后再拼一次。</span>`}
    stats();const pl=document.querySelector(".card .top .pills");if(pl)pl.outerHTML=pills(x)};
  $("chk").onclick=check;
  $("f").addEventListener("submit",e=>{e.preventDefault();check()});
  $("show").onclick=()=>{$("res").innerHTML=`<div class="spellans">${esc(x.w)}</div><div class="hint">${esc(x.ipa)} · 记住后点「下一个」，过一会儿再回来拼。</div>`};
  stats();
}

/* 浏览 */
function renderList(){
  const p=pool(); let html="", lastG=-1;
  p.forEach(x=>{const gi=GROUPS.findIndex((q,i)=>i>0&&x.n>=q[1]&&x.n<=q[2]);
    if(g===0&&gi!==lastG){html+=`<div class="grp">${GROUPS[gi][0]}</div>`;lastG=gi}
    html+=`<div class="row"><span class="n">${x.n}</span>
      <div class="main"><span class="w">${esc(x.w)}</span>
        <span class="meta">${esc(x.zh)} · <span class="ipa">${esc(x.ipa)}</span></span>
        <span class="meta" style="color:var(--muted)">${esc(x.ph)} — ${esc(x.phzh)}</span>${pills(x)}</div>
      <div class="tools"><button class="icon" data-k="w${x.n}" aria-label="听单词 ${esc(x.w)}">${SPK}</button><button class="icon" data-k="p${x.n}" aria-label="听短语">${SPK}</button></div></div>`});
  $("view").innerHTML=`<div class="list">${html||'<div class="row"><span></span><div class="main">没有符合条件的词。</div></div>'}</div>`;
  $("view").querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>play(b.dataset.k,b));
  stats();
}

function render(){
  ["Say","Spell","List"].forEach(m=>$("m"+m).setAttribute("aria-pressed",mode===m.toLowerCase()));
  $("tip").innerHTML=TIPS[mode];
  if(mode==="say")renderSay();else if(mode==="spell")renderSpell();else renderList();
}
$("mSay").onclick=()=>{mode="say";idx=0;shown=false;lastRes="";spellMsg="";render()};
$("mSpell").onclick=()=>{mode="spell";idx=0;render()};
$("mList").onclick=()=>{mode="list";render()};
$("grp").onchange=e=>{g=+e.target.value;idx=0;shown=false;lastRes="";render()};
$("onlyAgain").onchange=()=>{idx=0;shown=false;lastRes="";render()};

/* 同步到 Google Drive */
const SYNC_URL="https://script.google.com/macros/s/AKfycbzIekTZ0svOTIcX9QeFEiTRC8BLsAH2eWwiVjluWs_DShgcB24XRGKYNdWMV7izu1iZ/exec";
const DEV=/iPad/.test(navigator.userAgent)||(/Macintosh/.test(navigator.userAgent)&&navigator.maxTouchPoints>1)?"iPad":/iPhone/.test(navigator.userAgent)?"iPhone":/Mac/.test(navigator.userAgent)?"Mac":"其他设备";
let syncKey="";try{syncKey=localStorage.getItem("drv-key")||""}catch(e){}
{const m=location.hash.match(/k=([\w-]+)/);if(m){syncKey=m[1];try{localStorage.setItem("drv-key",syncKey)}catch(e){}}}
let syncQ=[];try{syncQ=JSON.parse(localStorage.getItem("drv-q")||"[]")}catch(e){}
syncQ.forEach(q=>{q.d=q.d||"drv"});
const known={drv:{},txt:{}};let syncBusy=false,syncAgain=false,syncTimer=0;
const saveQ=()=>{try{localStorage.setItem("drv-q",JSON.stringify(syncQ))}catch(e){}};
const syncEl=document.createElement("div");syncEl.className="sync";syncEl.id="sync";$("stats").after(syncEl);
const syncShow=t=>{syncEl.textContent=t};
const deckSt=d=>d===deck?st:stLoad(d);
function enqueueNew(){let added=false;
  for(const d in DECKS){const o=deckSt(d),L=DECKS[d].D;
    for(const k in o){const n=+k;for(const t of ["say","spell"]){
      if(o[k][t]&&!(known[d][k]&&known[d][k][t])&&!syncQ.some(q=>q.d===d&&q.n===n&&q.t===t)){const x=L[n-1]||{};
        syncQ.push({d,n,t,w:x.w||"",zh:x.zh||"",at:Date.now(),dev:DEV});added=true}}}}
  if(added)saveQ();return added}
function mergeRemote(d,r){let changed=false;const o=deckSt(d);
  for(const k in r){for(const t of ["say","spell"]){if(r[k][t]){
    (known[d][k]||(known[d][k]={}))[t]=true;
    if(!(o[k]&&o[k][t])){(o[k]||(o[k]={}))[t]=true;changed=true}}}}
  if(changed)stSave(d,o);
  return changed&&d===deck}
function syncNote(){if(!syncKey)return;enqueueNew();clearTimeout(syncTimer);syncTimer=setTimeout(syncRun,800)}
async function syncRun(){
  if(!syncKey){syncShow("☁️ 还没连接 Google Drive：用带同步码的链接打开一次即可。");return}
  if(syncBusy){syncAgain=true;return}
  syncBusy=true;syncShow("☁️ 正在同步…");let changed=false;
  try{
    for(const d in DECKS){
      const g=await (await fetch(SYNC_URL+"?deck="+d+"&key="+encodeURIComponent(syncKey),{cache:"no-store"})).json();
      if(!g.ok)throw new Error(g.error==="key"?"同步码不对":"同步失败");
      if(mergeRemote(d,g.st||{}))changed=true}
    enqueueNew();
    for(const d in DECKS){const sent=syncQ.filter(q=>q.d===d);if(!sent.length)continue;
      const p=await (await fetch(SYNC_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({key:syncKey,deck:d,events:sent})})).json();
      if(!p.ok)throw new Error("上传失败");
      syncQ=syncQ.filter(q=>!sent.includes(q));saveQ();
      if(mergeRemote(d,p.st||{}))changed=true}
    const t=new Date();syncShow("☁️ 已同步到 Google Drive · "+t.getHours()+":"+String(t.getMinutes()).padStart(2,"0"));
    if(changed)render();
  }catch(e){
    syncShow("☁️ "+(navigator.onLine===false?"现在离线，联网后自动上传":(e.message||"同步失败")+"，稍后自动重试")+(syncQ.length?"（待上传 "+syncQ.length+" 条）":""));
  }finally{syncBusy=false;if(syncAgain){syncAgain=false;syncTimer=setTimeout(syncRun,500)}}
}
window.addEventListener("online",syncRun);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")syncRun()});

/* 切换词表 */
function setDeck(k){
  deck=k;D=DECKS[k].D;GROUPS=DECKS[k].G;st=stLoad(k);
  g=0;idx=0;shown=false;lastRes="";spellMsg="";myUrl=null;myFor=0;
  try{localStorage.setItem("drv-deck",k)}catch(e){}
  fillGroups();$("grp").value="0";
  $("ttl").textContent=DECKS[k].ttl;$("sub").textContent=DECKS[k].sub;
  $("dDrv").setAttribute("aria-pressed",k==="drv");$("dTxt").setAttribute("aria-pressed",k==="txt");
  player.pause();render()}
$("dDrv").onclick=()=>{if(deck!=="drv")setDeck("drv")};
$("dTxt").onclick=()=>{if(deck!=="txt")setDeck("txt")};
setDeck(deck);
syncRun();
if("serviceWorker" in navigator)window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})});
</script>
